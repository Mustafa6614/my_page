<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mustafa Özyürek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #faf8f5;
    --ink: #1a1814;
    --muted: #7a7470;
    --subtle: #ede9e3;
    --accent: #c45c2e;
    --serif: 'Lora', Georgia, serif;
    --sans: 'Inter', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
  }

  .wrap { max-width: 620px; margin: 0 auto; padding: 0 2rem; }

  /* LANG SWITCHER */
  .lang-switcher {
    position: fixed;
    top: 1.25rem;
    right: 1.5rem;
    display: flex;
    gap: 4px;
    z-index: 100;
    background: var(--bg);
    border: 1px solid var(--subtle);
    border-radius: 100px;
    padding: 4px;
  }

  .lang-btn {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 11px;
    border-radius: 100px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.18s;
    letter-spacing: 0.03em;
  }

  .lang-btn:hover { color: var(--ink); }
  .lang-btn.active { background: var(--ink); color: var(--bg); }

  /* HERO */
  .hero { padding: 7rem 0 4rem; }

  .hello {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.05rem;
    color: var(--accent);
    margin-bottom: 1.25rem;
  }

  .hero h1 {
    font-family: var(--serif);
    font-size: clamp(2.6rem, 7vw, 4rem);
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 1.5rem;
  }

  .hero-text {
    font-size: 1.05rem;
    color: var(--muted);
    max-width: 480px;
    line-height: 1.85;
    margin-bottom: 2.5rem;
  }

  .hero-text strong { color: var(--ink); font-weight: 500; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 100px;
    text-decoration: none;
    transition: all 0.18s;
  }

  .chip-email { background: var(--ink); color: var(--bg); }
  .chip-email:hover { background: #333; }
  .chip-phone { background: var(--subtle); color: var(--ink); }
  .chip-phone:hover { background: #e2ddd6; }
  .chip-cv { border: 1px solid var(--accent); color: var(--accent); }
  .chip-cv:hover { background: var(--accent); color: var(--bg); }

  .divider { border: none; border-top: 1px solid var(--subtle); margin: 4rem 0; }

  .block { margin-bottom: 4rem; }

  .label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.25rem;
  }

  .block p { font-size: 1rem; color: var(--muted); line-height: 1.9; margin-bottom: 1rem; }
  .block p:last-child { margin-bottom: 0; }
  .block p strong { color: var(--ink); font-weight: 500; }

  /* SKILLS */
  .skill-line {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    padding: 0.9rem 0;
    border-bottom: 1px solid var(--subtle);
  }
  .skill-line:first-of-type { border-top: 1px solid var(--subtle); }
  .skill-cat { font-size: 13px; font-weight: 500; color: var(--ink); min-width: 130px; flex-shrink: 0; }
  .skill-items { font-size: 13px; color: var(--muted); }

  /* TIMELINE */
  .tl-item { display: flex; gap: 1.5rem; padding-bottom: 2.5rem; position: relative; }
  .tl-item::before {
    content: ''; position: absolute; left: 4px; top: 18px; bottom: 0;
    width: 1px; background: var(--subtle);
  }
  .tl-item:last-child::before { display: none; }
  .tl-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 6px; position: relative; z-index: 1; }
  .tl-dot.muted { background: #ccc; }
  .tl-dot.future,
  .tl-dot.current {
    background: var(--bg);
    border: 2px solid var(--accent);
    width: 11px;
    height: 11px;
  }

  /* AVATAR */
  .avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--subtle);
    color: var(--accent);
    font-family: var(--serif);
    font-size: 1rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1rem;
    letter-spacing: 0.02em;
  }

  .hero-meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 1rem;
    font-family: var(--sans);
  }
  .tl-body { flex: 1; }
  .tl-year { font-size: 12px; color: var(--muted); margin-bottom: 3px; font-weight: 500; }
  .tl-title { font-family: var(--serif); font-size: 1.05rem; color: var(--ink); margin-bottom: 2px; line-height: 1.3; }
  .tl-where { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .tl-desc { font-size: 13.5px; color: var(--muted); line-height: 1.7; }

  /* LANG ROWS */
  .lang-row { display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid var(--subtle); font-size: 14px; }
  .lang-row:first-of-type { border-top: 1px solid var(--subtle); }
  .lang-name { color: var(--ink); font-weight: 500; }
  .lang-level { color: var(--muted); }

  /* FOOTER */
  footer { padding: 3rem 0 5rem; text-align: center; }
  .footer-text { font-family: var(--serif); font-style: italic; font-size: 1rem; color: var(--muted); margin-bottom: 0.5rem; }
  .footer-email { font-size: 13px; color: var(--accent); text-decoration: none; }
  .footer-email:hover { text-decoration: underline; }
  .footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.25rem; }

  /* ANIMATIONS */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .hero  { animation: fadeIn 0.7s ease both; }
  .block { animation: fadeIn 0.7s 0.1s ease both; }

  @keyframes langSwitch { from { opacity: 0; } to { opacity: 1; } }
  .wrap { animation: langSwitch 0.25s ease both; }

  @media (max-width: 500px) {
    .skill-line { flex-direction: column; gap: 4px; }
    .skill-cat { min-width: unset; }
    .lang-switcher { top: 0.75rem; right: 0.75rem; }
  }
</style>
</head>
