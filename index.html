function renderSite(){const l=t[lang],u=ui[lang],cats=[l.cat1,l.cat2,l.cat3,l.cat4];document.documentElement.lang=lang;document.getElementById('nav').innerHTML=ids.map((id,i)=>`<a href="#${id}">${u.nav[i]}</a>`).join('');document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',b.dataset.lang===lang)});const cv=lang==='it'?'CV_Mustafa_Özyürek_IT.pdf':'CV_Mustafa_Özyürek_EN.pdf';document.getElementById('main').innerHTML=`
<section id="home" class="hero"><div class="hero-word" aria-hidden="true">MUSTAFA</div><div class="hero-copy"><p class="eyebrow">${u.location} · SOFTWARE & AI</p><h1>${u.role}</h1><p>${u.intro}</p><a class="pill dark" href="#projects">${u.nav[2]} <span>↗</span></a></div><aside class="hero-aside"><div class="meta">${u.study}<b>Software Engineering with AI</b>Università della Svizzera Italiana</div><div class="meta">BSc Computer Science<b>USI · 2026</b></div><a class="pill" href="${cv}" target="_blank" rel="noopener">${u.cv} ↓</a></aside><div class="hero-bottom"><span>${u.scroll}</span><span>MUSTAFA ÖZYÜREK · PORTFOLIO</span></div></section>
<section id="about">${sectionHead(1,u.about)}<div class="about-grid"><div><p>${l.heroText}</p><div class="lang-list">${l.langs.map(([n,v])=>`<span>${n}<small>${v}</small></span>`).join('')}</div></div><div><p>${l.who1}</p><p>${l.who2}</p></div></div><div class="about-note">${u.note}</div></section>
<section id="skills">${sectionHead(2,u.skills)}<div class="filters" role="group" aria-label="${u.nav[1]}">${[u.all,...cats].map((v,i)=>`<button data-filter="${i-1}" class="${i===0?'active':''}" aria-pressed="${i===0}">${v}</button>`).join('')}</div><div class="periodic">${toolsList.map(([sym,name,cat],i)=>`<button class="element" data-tool="${i}" data-cat="${cat}" aria-pressed="false"><small>${String(i+1).padStart(2,'0')} · ${cats[cat]}</small><b>${sym}</b><span>${name}</span></button>`).join('')}</div><div class="skill-detail" aria-live="polite">${u.hint}</div></section>
<section id="projects">${sectionHead(3,u.projects)}<div class="projects"><article class="project"><div class="project-art" aria-hidden="true"><div class="road"><div class="car"></div></div><div class="road-tag">LLM → Scenario</div></div><div class="project-body"><small>${u.projectTypes[0]}</small><h3>${u.projectTitles[0]}</h3><p>${l.tl[2].desc}</p><div class="tags"><span>LLM</span><span>AI</span><span>Simulation</span></div></div></article><article class="project"><div class="project-art" aria-hidden="true"><div class="flow"><span>${u.document}</span><i></i><span class="ai">AI + REST API</span><i></i><span>${u.interface}</span></div></div><div class="project-body"><small>${u.projectTypes[1]}</small><h3>${u.projectTitles[1]}</h3><p>${l.tl[3].desc}</p><div class="tags"><span>JavaScript</span><span>SmartUI</span><span>Groovy</span></div></div></article></div><p class="skill-detail">${u.illustration}</p></section>
<section id="journey">${sectionHead(4,u.journey)}<div class="timeline">${l.tl.map(x=>`<article class="entry"><div class="year">${x.current?'● ':''}${x.year}</div><div><h3>${x.title}</h3><small>${x.where}</small>${x.desc?`<p>${x.desc}</p>`:''}</div></article>`).join('')}</div></section>
<section id="contact" class="contact"><p class="eyebrow">05 / 05 · ${u.nav[4]}</p><h2>${u.contact}</h2><div class="contact-actions"><a class="pill dark" href="mailto:mustafaaozyurek@hotmail.com">${u.email} ↗</a><a class="pill" href="${cv}" target="_blank" rel="noopener">${u.cv} ↓</a><a class="pill" href="tel:+41762462576">${u.phone} ↗</a></div><div class="contact-bottom"><span>© ${new Date().getFullYear()} Mustafa Özyürek · ${u.footer}</span><a href="mailto:mustafaaozyurek@hotmail.com">mustafaaozyurek@hotmail.com ↗</a><a href="https://www.instagram.com/_mustafaa_66/" target="_blank" rel="noopener">Instagram ↗</a></div></section>`;
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b)});document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('dim',b.dataset.filter!=='-1'&&x.dataset.cat!==b.dataset.filter))}));document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tool]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b)});const [,name,cat]=toolsList[+b.dataset.tool];document.querySelector('.skill-detail').textContent=`${name} — ${u.skillNotes[cat]}`}));if(window.sectionObserver)window.sectionObserver.disconnect();window.sectionObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+e.target.id))}}),{rootMargin:'-15% 0px -55% 0px'});document.querySelectorAll('section').forEach(s=>window.sectionObserver.observe(s));}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('portfolio-lang',lang)}catch{}renderSite()}));renderSite();

</script></body></html>
